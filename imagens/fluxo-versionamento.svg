<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo básico de versionamento</title>
  <desc id="desc">Arquivos, staging, commit e repositório remoto no GitHub.</desc>
  <rect width="1000" height="280" rx="24" fill="#f5f7fb"/>
  <text x="500" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#16243a">Fluxo básico de versionamento</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="35" y="92" width="190" height="112" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="130" y="139" font-size="19" font-weight="700" fill="#12345b">Arquivos</text>
    <text x="130" y="168" font-size="14" fill="#334155">edite o projeto</text>

    <rect x="280" y="92" width="190" height="112" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="375" y="139" font-size="19" font-weight="700" fill="#14532d">Staging</text>
    <text x="375" y="168" font-size="14" fill="#334155">selecione mudanças</text>

    <rect x="525" y="92" width="190" height="112" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="620" y="139" font-size="19" font-weight="700" fill="#78350f">Commit</text>
    <text x="620" y="168" font-size="14" fill="#334155">registre uma versão</text>

    <rect x="770" y="92" width="195" height="112" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="867" y="139" font-size="19" font-weight="700" fill="#4c1d95">GitHub</text>
    <text x="867" y="168" font-size="14" fill="#334155">compartilhe o histórico</text>
  </g>
  <g stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M235 148h34m-10-10 10 10-10 10"/><path d="M480 148h34m-10-10 10 10-10 10"/><path d="M725 148h34m-10-10 10 10-10 10"/>
  </g>
</svg>
